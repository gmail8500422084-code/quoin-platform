<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quoin</title>
  <style>
    :root {
      --or: #FF6B2B;
      --tl: #14B8A6;
      --nv: #0F172A;
      --cr: #FFFCF8;
      --bg: #0A101C;
      --tx: #FFFCF8;
      --mu: #8FA0B8;
      --gl: rgba(20, 30, 48, .85);
      --bd: rgba(20, 184, 166, .28);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media(prefers-color-scheme:dark) {
      :root:not([data-theme=light]) {
        --bg: #0A101C
      }
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--tx);
      overflow: hidden
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(110px);
      opacity: .16;
      z-index: 0
    }

    .b1 {
      width: 380px;
      height: 380px;
      background: var(--or);
      top: -80px;
      left: -80px
    }

    .b2 {
      width: 420px;
      height: 420px;
      background: var(--tl);
      bottom: -120px;
      right: -100px
    }

    .glass {
      background: var(--gl);
      border: 1px solid var(--bd);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      padding: 16px
    }

    #auth {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: auto
    }

    #auth .glass {
      width: 100%;
      max-width: 400px
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: .5px
    }

    .logo i {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--or), var(--tl));
      display: grid;
      place-items: center;
      font-style: normal;
      color: #fff;
      overflow: hidden
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border-radius: 10px;
      border: 1px solid var(--bd);
      background: rgba(255, 252, 248, .07);
      color: var(--tx);
      font: inherit
    }

    input::placeholder {
      color: var(--mu)
    }

    select option {
      color: #000
    }

    button {
      font: inherit;
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      padding: 9px 14px;
      color: #fff;
      background: var(--or)
    }

    button.t {
      background: var(--tl)
    }

    button.g {
      background: transparent;
      border: 1px solid var(--bd);
      color: var(--tx)
    }

    button.d {
      background: #c0392b
    }

    button:hover {
      animation: blink .7s ease-in-out infinite
    }

    @keyframes blink {
      50% {
        box-shadow: 0 0 14px 3px var(--or);
        filter: brightness(1.25)
      }
    }

    button.t:hover {
      --x: 1
    }

    .pw {
      position: relative
    }

    .pw button {
      position: absolute;
      right: 4px;
      top: 6px;
      padding: 5px 9px;
      background: transparent
    }

    a.l {
      color: var(--tl);
      cursor: pointer;
      font-size: 13px
    }

    #app {
      position: relative;
      z-index: 1;
      height: 100%;
      display: none
    }

    #side {
      width: 230px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-radius: 0;
      transition: .25s;
      flex-shrink: 0
    }

    #side.h {
      width: 0;
      padding: 0;
      overflow: hidden;
      border: 0
    }

    #side .n {
      background: transparent;
      text-align: left;
      border-radius: 10px;
      color: var(--tx)
    }

    #side .n.on {
      background: linear-gradient(90deg, var(--or), #ff8f5a)
    }

    #side .n:hover {
      background: var(--tl);
      animation: blink .7s infinite
    }

    .user {
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px
    }

    .user .logo {
      font-size: 14px
    }

    main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      height: 100%
    }

    .top {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px
    }

    .top h2 {
      margin: 0;
      font-size: 18px;
      flex: 1
    }

    .body {
      flex: 1;
      overflow: auto;
      padding: 0 16px 80px
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 14px
    }

    .stat {
      --c: #14B8A6;
      position: relative;
      overflow: hidden;
      transition: transform .2s, box-shadow .2s;
      background: linear-gradient(135deg, color-mix(in srgb, var(--c) 30%, transparent), var(--gl));
      border-color: color-mix(in srgb, var(--c) 55%, transparent)
    }

    .stat:before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 5px;
      background: var(--c)
    }

    .stat:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 28px color-mix(in srgb, var(--c) 45%, transparent)
    }

    .stat .ic {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-size: 19px;
      background: var(--c);
      box-shadow: 0 4px 14px color-mix(in srgb, var(--c) 60%, transparent)
    }

    .stat .hd {
      display: flex;
      align-items: center;
      justify-content: space-between
    }

    .stat b {
      display: block;
      font-size: 28px;
      margin: 8px 0 2px
    }

    .stat span {
      color: var(--mu);
      font-size: 13px
    }

    .stat small {
      color: var(--c);
      font-weight: 700;
      font-size: 12px;
      filter: brightness(1.25)
    }

    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px
    }

    .tw {
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px
    }

    td,
    th {
      padding: 7px;
      border-bottom: 1px solid var(--bd);
      text-align: left
    }

    td input,
    td select {
      margin: 0;
      min-width: 70px
    }

    .tag {
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 12px;
      background: var(--tl);
      color: #fff
    }

    .tag.o {
      background: var(--or)
    }

    .tot {
      text-align: right;
      line-height: 1.7
    }

    .acts button {
      padding: 5px 9px;
      margin: 2px;
      font-size: 12px
    }

    #bot {
      position: fixed;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      z-index: 5
    }

    #bot>button {
      border-radius: 50%;
      width: 52px;
      height: 52px;
      background: var(--tl);
      font-size: 22px
    }

    #chat {
      display: none;
      position: absolute;
      bottom: 62px;
      right: 0;
      width: 330px;
      max-width: 88vw;
      padding: 0;
      overflow: hidden
    }

    .ch0 {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: linear-gradient(90deg, var(--or), #ff8f5a)
    }

    .ch0 b {
      flex: 1
    }

    .ch0 a {
      cursor: pointer;
      font-size: 12px
    }

    #cm {
      max-height: 260px;
      min-height: 120px;
      overflow: auto;
      padding: 10px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .bb {
      max-width: 85%;
      padding: 7px 10px;
      border-radius: 12px
    }

    .bb.b {
      background: rgba(20, 184, 166, .2);
      align-self: flex-start
    }

    .bb.u {
      background: var(--or);
      align-self: flex-end
    }

    #cc {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 10px 8px
    }

    #cc .ch {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 20px
    }

    .ir {
      display: flex;
      gap: 6px;
      padding: 8px;
      border-top: 1px solid var(--bd)
    }

    .ir input {
      margin: 0
    }

    .ir button {
      padding: 6px 10px
    }

    #mic.rec {
      background: #c0392b;
      animation: blink .7s infinite
    }

    .stat {
      background: linear-gradient(160deg, rgba(255, 255, 255, .04), transparent);
      border: 1.5px solid color-mix(in srgb, var(--c) 70%, transparent);
      box-shadow: inset 0 0 26px color-mix(in srgb, var(--c) 10%, transparent)
    }

    .stat:before {
      display: none
    }

    .stat .ic {
      border-radius: 10px;
      width: 34px;
      height: 34px;
      font-size: 16px
    }

    .stat .hd {
      flex-direction: row-reverse;
      justify-content: flex-end;
      gap: 10px
    }

    .stat b {
      font-size: 34px;
      letter-spacing: -1px;
      margin: 12px 0 4px
    }

    .stat small {
      color: #22C55E;
      filter: none;
      font-size: 11px
    }

    #side .n {
      font-size: 13px;
      color: #cbd5e1
    }

    #side .n.on {
      background: var(--or);
      color: #fff;
      box-shadow: 0 4px 14px rgba(255, 107, 43, .35)
    }

    .act {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      font-size: 13px
    }

    .act .ic2 {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: var(--c);
      flex-shrink: 0
    }

    .act small {
      color: var(--mu);
      display: block;
      font-size: 11px
    }

    .bdg {
      margin-left: auto;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      background: color-mix(in srgb, var(--c) 25%, transparent);
      color: var(--c);
      filter: brightness(1.3)
    }

    .ph {
      color: var(--mu);
      font-size: 12px;
      margin: 2px 0 10px
    }

    .acc {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px;
      border: 1px solid var(--bd);
      border-radius: 12px;
      margin: 6px 0;
      cursor: pointer
    }

    .acc.on {
      border-color: var(--or);
      background: rgba(255, 107, 43, .1)
    }

    .acc small {
      display: block;
      color: var(--mu);
      font-size: 11px
    }

    .av {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--or), var(--tl));
      display: grid;
      place-items: center;
      font-style: normal;
      font-weight: 700;
      overflow: hidden;
      flex-shrink: 0
    }

    .av img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    #pr {
      display: none
    }

    @media(max-width:700px) {
      #side {
        position: fixed;
        z-index: 6;
        height: 100%;
        background: #0F172Af0
      }

      #side.h {
        width: 0
      }
    }

    @media print {
      body {
        overflow: visible;
        background: #fff
      }

      #auth,
      #app,
      .blob,
      #bot {
        display: none !important
      }

      #pr {
        display: block;
        color: #000;
        padding: 20px;
        font-size: 13px
      }

      #pr td,
      #pr th {
        border-bottom: 1px solid #999
      }
    }
  </style>
</head>

    function anal() { const s = stats(); E('#v', `<div class="cards">${[['Invoiced income', inr(s.a)], ['Received income', inr(s.r)], ['Balance / pending', inr(s.bal)], ['Purchases', inr(s.p)], ['Profit (invoice − purchases)', inr(s.pr)], ['Clients', S.clients.length], ['Vendors', S.vendors.length]].map(c => `<div class="glass stat"><span>${c[0]}</span><b>${c[1]}</b></div>`).join('')}</div><div class="glass">${chart([s.a, s.r, s.bal, s.p, Math.max(0, s.pr)], ['Invoiced', 'Received', 'Pending', 'Bought', 'Profit'])}</div><p style="color:var(--mu)">Duplicate invoices marked NC are excluded.</p>`) }
    /* SETTINGS */
    function sett() {
      const u = S.acct || {}; E('#v', `<div class="glass"><h3 style="margin-top:0">Business profile</h3><div style="display:flex;align-items:center;gap:14px;margin-bottom:10px"><div class="logo" id="lp" style="font-size:0">${logo(u)}</div><div><input type="file" id="sl" accept="image/*" style="margin:0"><small style="color:var(--mu)">Business logo · shown in the sidebar and on printed quotes/invoices</small> <a class="l" id="rl">Remove</a></div></div><div class="row">${[['biz', 'Business name'], ['gst', 'GST'], ['addr', 'Registered address'], ['cp', 'Contact person'], ['ph', 'Contact number']].map(f => `<input id="s_${f[0]}" placeholder="${f[1]}" value="${u[f[0]] || ''}">`).join('')}</div><button id="sp" style="margin-top:8px">Save profile</button><button class="d" id="rs" style="margin:8px 0 0 8px">Reset all data</button><p style="color:var(--mu)">${guest ? 'Guest mode: profile saves are disabled.' : ''}</p></div>`);
      window.NL = null; $('#sl').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, 256 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); window.NL = c.toDataURL('image/png'); $('#lp').innerHTML = '<i><img src="' + NL + '"></i>' }; im.src = r.result }; r.readAsDataURL(f) }; $('#rl').onclick = () => { window.NL = ''; $('#lp').innerHTML = '<i>Q</i>' };
      $('#sp').onclick = () => { if (guest || !S.acct) return alert('Create an account to save a profile.');['biz', 'gst', 'addr', 'cp', 'ph'].forEach(f => S.acct[f] = $('#s_' + f).value); if (window.NL !== null) S.acct.logo = window.NL; S.user = S.acct; save(); E('#slogo', '<i><img src="' + AL + '"></i>QUOIN'); E('#su', logo(S.user) + '<span>' + S.user.name + '</span>'); alert('Saved') };
      $('#rs').onclick = () => { if (confirm('Erase everything?')) { try { localStorage.removeItem('quoin') } catch (e) { } S = JSON.parse(JSON.stringify(DEF)); location.reload() } }
    }
    /* BOT */
    S.chat = S.chat || []; let bs = { step: 'idle' }, bd = {}; const CATS = ['Fabrication', 'ACP', 'Cladding', 'Printing', 'Mounting', 'Materials', 'Electricals', 'Others'];
    const nm = k => ({ quotes: 'quotation', invoices: 'invoice', purchases: 'purchase' })[k];
    const bm = (w, t) => { S.chat.push({ w, t }); S.chat = S.chat.slice(-40); save(); showMsgs() };
    function showMsgs() { const m = $('#cm'); m.innerHTML = S.chat.map(x => `<div class="bb ${x.w}">${x.t}</div>`).join(''); m.scrollTop = m.scrollHeight }
    function chips(a) { E('#cc', a.map(x => `<button class="g ch">${x}</button>`).join('')); document.querySelectorAll('#cc .ch').forEach(b => b.onclick = () => { bm('u', b.textContent); flow(b.textContent) }) }
    const topics = () => guest ? ['Quotations', 'Invoices'] : ['Quotations', 'Invoices', 'Purchases'];
    function greet() { bm('b', 'Hi, how can I help you? 👋 Choose a related query:'); bs = { step: 'topic' }; bd = {}; chips(topics()) }
    function go(p, msg) { page = p; render(); bm('b', msg); chips(['Start over']); if (innerWidth < 700) $('#chat').style.display = 'none' }
    function ask(qs, done) { bs = { step: 'ask', qs, i: 0, done }; nextQ() }
    function nextQ() { const q = bs.qs[bs.i]; bm('b', q[1]); if (q[2]) chips(q[2]); else E('#cc', '') }
    function details() { bm('b', 'Great. Now the description and requirements.'); ask([['desc', 'Description of the work?'], ['w', 'Width (ft)?'], ['h', 'Height (ft)?'], ['r', 'Rate per sqft (₹)?'], ['q', 'Quantity?']], finish) }
    function finish() {
      const k = bd.k, L = S[k], d = { items: [{ d: bd.desc, w: +bd.w || 1, h: +bd.h || 1, r: +bd.r || 0, q: +bd.q || 1, u: 'sqft' }], tax: 18, gst: true, disc: 0, terms: TERMS, date: new Date().toISOString().slice(0, 10), client: bd.client, no: (k == 'quotes' ? 'Q-' : 'INV-') + String(L.length + 1).padStart(3, '0'), rev: 0, pay: [{ n: 'Advance', pct: 50, paid: false }, { n: 'Final', pct: 50, paid: false }] };
      if (bd.newc && !S.clients.find(c => c.name == bd.client)) S.clients.push({ name: bd.client, gstin: bd.gstin, addr: bd.addr, cp: bd.cp, ph: bd.ph, cat: '', mail: '' });
      S.ed = { k, d, i: -1 }; save(); go(k == 'quotes' ? 'Quotations' : 'Invoices', 'Everything is filled in. Go to the end of the page to verify, then press Save.')
    }
    function flow(t) {
      const l = t.toLowerCase().trim(), st = bs.step;
      if (l == 'start over') return greet();
      if (st == 'topic') { const k = l.includes('quot') ? 'quotes' : l.includes('inv') ? 'invoices' : l.includes('purch') ? 'purchases' : null; if (!k) return bm('b', 'Please pick Quotations, Invoices or Purchases.'); if (guest && k == 'purchases') return bm('b', 'Guest login can only use Quotations and Invoices.'); bd = { k }; bs = { step: 'ne' }; bm('b', 'Is it a new ' + nm(k) + ' or an existing one?'); return chips(['New', 'Existing']) }
      if (st == 'ne') {
        const k = bd.k;
        if (!l.includes('exist')) { if (k == 'purchases') return ask([['cat', 'Category?', CATS], ['v', 'Vendor name?'], ['a', 'Amount (₹)?'], ['x', 'Tax %? (type 0 if none)'], ['i', 'Discount %? (type 0 if none)']], () => { window.PP = bd; go('Purchases', 'Details are filled in. Please verify and press “Add purchase”.') }); bs = { step: 'cl' }; bm('b', 'Add a new client or use an existing client?'); return chips(['Add client', 'Existing client']) }
        if (k == 'purchases') return go('Purchases', 'Here are your saved purchases.');
        const L = S[k]; if (!L.length) { bm('b', 'No saved ' + nm(k) + 's yet. Let’s create a new one.'); return flow('new') }
        bs = { step: 'pick' }; bm('b', 'Select one to open:'); bd.list = L.slice(-6).reverse(); return chips(bd.list.map(x => x.no + ' · ' + x.client))
      }
      if (st == 'pick') { const x = (bd.list || []).find(y => t.startsWith(y.no)); if (!x) return bm('b', 'Please tap one of the options.'); S.ed = { k: bd.k, d: JSON.parse(JSON.stringify(x)), i: S[bd.k].indexOf(x) }; return go(bd.k == 'quotes' ? 'Quotations' : 'Invoices', 'Opened ' + x.no + '. Please verify the details on the page.') }
      if (st == 'cl') {
        if (l.includes('exist')) { if (!S.clients.length) { bm('b', 'No saved clients yet, so let’s add one.'); return flow('add client') } bs = { step: 'cpick' }; bm('b', 'Choose the client:'); return chips(S.clients.slice(0, 8).map(c => c.name)) }
        return ask([['client', 'Client name?'], ['gstin', 'Client GSTIN? (type - to skip)'], ['addr', 'Registered address?'], ['cp', 'Contact person?'], ['ph', 'Contact number?']], () => { bd.newc = true; details() })
      }
      if (st == 'cpick') { const c = S.clients.find(c => c.name.toLowerCase() == l); if (!c) return bm('b', 'Please tap a client name.'); bd.client = c.name; return details() }
      if (st == 'ask') { const q = bs.qs[bs.i]; bd[q[0]] = t; bs.i++; if (bs.i < bs.qs.length) return nextQ(); const d = bs.done; bs = { step: 'idle' }; E('#cc', ''); return d() }
      answer(l)
    }
    function answer(l) {
      const s = stats();
      if (/(new|create|make|add)/.test(l) && /(quot|invoice|purchase)/.test(l)) { bs = { step: 'topic' }; return flow(l) }
      let a = null; if (/profit/.test(l)) a = 'Profit: ' + inr(s.pr); else if (/pending|balance/.test(l)) a = 'Pending: ' + inr(s.bal); else if (/revenue|income/.test(l)) a = 'Invoiced ' + inr(s.a) + ', received ' + inr(s.r) + ' across ' + S.invoices.length + ' invoices.'; else if (/clients?/.test(l)) a = S.clients.length + ' clients.'; else if (/vendors?/.test(l)) a = S.vendors.length + ' vendors.';
      if (a) { bm('b', a); return } bm('b', 'I can help with Quotations, Invoices or Purchases. Pick one:'); bs = { step: 'topic' }; chips(topics())
    }
    function send() { const v = $('#ci').value.trim(); if (!v && !selectedChatImage) return; if (selectedChatImage) { bm('b', 'Image selected: ' + selectedChatImage.name + '. Image preview is available, but image understanding is not connected yet. To let Quoin AI analyse images, a secure vision API/backend must be configured.'); selectedChatImage = null; $('#chatImage').value = ''; $('#imgPreview').style.display = 'none'; E('#imgPreview', '') } if (v) { $('#ci').value = ''; bm('u', v.replace(/</g, '&lt;')); flow(v) } }
    $('#ci').onkeydown = e => { if (e.key == 'Enter') send() }; $('#sd').onclick = send;
    $('#cn').onclick = () => { S.chat = []; save(); greet() }; $('#cx2').onclick = () => $('#chat').style.display = 'none';
    $('#bot>button').onclick = () => { const c = $('#chat'), o = c.style.display == 'block'; c.style.display = o ? 'none' : 'block'; if (!o) { showMsgs(); const last = S.chat[S.chat.length - 1]; if (last && last.t.startsWith('Hi, how can I help')) { bs = { step: 'topic' }; bd = {}; chips(topics()) } else greet() } };
    let selectedChatImage = null;
    $('#pickImage').onclick = () => $('#chatImage').click();
    $('#chatImage').onchange = () => { const f = $('#chatImage').files[0]; if (!f) return; if (!f.type.startsWith('image/')) return alert('Please choose an image file.'); if (f.size > 8 * 1024 * 1024) { $('#chatImage').value = ''; return alert('Please choose an image smaller than 8 MB.') } selectedChatImage = f; const url = URL.createObjectURL(f); E('#imgPreview', `<div style="display:flex;align-items:center;gap:8px"><img src="${url}" alt="Selected image preview" style="width:58px;height:58px;object-fit:cover;border-radius:8px"><span style="font-size:12px;color:var(--mu);flex:1">${f.name}</span><button type="button" class="d" id="removeChatImage">Remove</button></div>`); $('#imgPreview').style.display = 'block'; $('#removeChatImage').onclick = () => { selectedChatImage = null; $('#chatImage').value = ''; $('#imgPreview').style.display = 'none'; E('#imgPreview', '') } };
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null;
    $('#mic').onclick = () => { if (!SR) return bm('b', 'Voice input is not supported in this browser. Please type instead.'); if (rec) { rec.stop(); return } rec = new SR(); rec.lang = 'en-IN'; rec.onresult = e => { $('#ci').value = e.results[0][0].transcript; send() }; rec.onerror = () => bm('b', 'Could not use the microphone here. Please allow mic access or type instead.'); rec.onend = () => { rec = null; $('#mic').classList.remove('rec') }; $('#mic').classList.add('rec'); try { rec.start() } catch (e) { rec = null } };
    // Allow Enter to submit the active authentication screen, including the account picker.
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter' || e.defaultPrevented || e.isComposing) return;
      const auth = document.getElementById('auth');
      if (!auth || getComputedStyle(auth).display === 'none') return;
      if (!(e.target instanceof HTMLInputElement)) return;
      e.preventDefault();
      const submitButton = document.getElementById('ok');
      if (submitButton && !submitButton.disabled) submitButton.click();
    });
    // Restore Supabase session after Google redirects back to Quoin.
(async function restoreSupabaseSession() {
  try {
    const { data, error } = await window.supabaseClient.auth.getSession();

    if (error) throw error;

    if (data.session && data.session.user) {
      const user = data.session.user;

      S.user = {
        name:
          user.user_metadata?.full_name ||
          user.user_metadata?.name ||
          user.email?.split('@')[0] ||
          'User',
        em: user.email || '',
        biz: 'Quoin'
      };

      S.acct = S.user;
      guest = false;
      enter();
    }
  } catch (error) {
    console.error('Quoin session restore error:', error);
    E('#am', 'Could not restore your login session. Please try again.');
  }
})();
    authUI();
